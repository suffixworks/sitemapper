name = "sitemapper"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Server secrets are set with `wrangler secret put <NAME>` (never committed):
#   SUPABASE_SERVICE_ROLE_KEY, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
# Public NEXT_PUBLIC_* vars are baked at build time (GitHub Actions build env).

# Cron Triggers (Phase 6 / infra): Supabase keep-alive + daily backup.
# [triggers]
# crons = ["0 3 * * *"]
